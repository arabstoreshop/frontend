name: Deploy storefront

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static storefront
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_API_URL: https://api.naseem.beauty
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_TIKTOK_PIXEL_ID }}
          NEXT_PUBLIC_SNAP_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_SNAP_PIXEL_ID }}
        run: |
          rm -f src/middleware.ts
          npm run build
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: naseem.beauty
          force_orphan: true
